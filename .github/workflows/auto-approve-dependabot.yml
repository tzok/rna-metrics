name: Dependabot auto-approve
on: pull_request_target

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # The PR author stays dependabot[bot] even when a re-run is triggered by a
    # maintainer, unlike github.actor.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2.2.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Merge Dependabot non-major PRs
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch' }}
        run: |
          # `gh pr merge --auto` only works while the PR is BLOCKED, i.e. held
          # back by an unmet requirement. main requires no status checks, so as
          # soon as anything is running or failing -- including this very job's
          # own check run -- the PR is UNSTABLE and GitHub rejects the mutation
          # with "Pull request is in unstable status".
          #
          # `pull_request_target` also fires as soon as the PR is opened, in
          # parallel with the `Tests` workflow, so nothing has verified the bump
          # yet. Wait for the other checks to finish, then merge directly. This
          # job's own check run is excluded from the wait: it stays in progress
          # until this job ends, so including it would never reach a verdict.
          for attempt in $(seq 1 80); do
            # `gh pr checks` exits non-zero when checks are failing or pending,
            # so keep stdout regardless of status and only fall back when it is
            # genuinely empty.
            checks=$(gh pr checks "$PR_URL" --json name,bucket 2>/dev/null) || true
            [ -n "$checks" ] || checks='[]'
            others=$(jq --arg self "$SELF_CHECK" 'map(select(.name != $self))' <<<"$checks")
            echo "attempt $attempt: $others"
            if [ "$(jq -r 'any(.bucket == "fail")' <<<"$others")" = "true" ]; then
              echo "::error::CI failed on $PR_URL, leaving it open for a human"
              exit 1
            fi
            if [ "$(jq -r 'length > 0 and all(.bucket != "pending")' <<<"$others")" = "true" ]; then
              break
            fi
            if [ "$attempt" = 80 ]; then
              echo "::error::timed out waiting for CI on $PR_URL"
              exit 1
            fi
            sleep 15
          done

          merge_now() {
            gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
          }
          enable_auto() {
            gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
          }

          # mergeStateStatus is computed asynchronously, so gh can see BLOCKED
          # and pick enablePullRequestAutoMerge just as the state flips to
          # UNSTABLE. Try both paths, with retries, instead of failing on the race.
          for attempt in 1 2 3; do
            state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus 2>/dev/null || echo UNKNOWN)
            echo "attempt $attempt: mergeStateStatus=$state"
            merge_now && exit 0
            echo "::warning::direct merge failed, falling back to auto-merge"
            enable_auto && exit 0
            echo "::warning::auto-merge failed, retrying in 10s"
            sleep 10
          done

          echo "::error::could not merge or enable auto-merge for $PR_URL"
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF_CHECK: ${{ github.job }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
